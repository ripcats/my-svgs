<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>demo</title>
<style>
  body { background:#060708; display:flex; flex-direction:column; gap:30px; align-items:center; justify-content:center; height:100vh; margin:0; font-family:sans-serif; }

  .bubble { background:#2b5cff; color:#fff; padding:8px 14px; border-radius:16px; display:flex; align-items:center; gap:6px; font-size:15px; }

  .status {
    position: relative;
    width: 12.9px;
    height: 12px;
    opacity: .9;
    transition: width .18s ease;
  }
  .status.read { width: 17.2px; }
  .status svg {
    position: absolute;
    left: 0;
    top: 50%;
    width: 17.2px;
    height: 12px;
    transform: translateY(-50%);
  }
  .status svg path { stroke: #fff; }
  .status .p2 { opacity: 0; transition: opacity .18s ease; }
  .status.read .p2 { opacity: 1; }

  .toggle { width:48px; height:28px; background:#333; border-radius:14px; position:relative; cursor:pointer; border:none; }
  .toggle::after { content:''; position:absolute; width:22px; height:22px; background:#fff; border-radius:50%; top:3px; left:3px; transition:left .18s ease; }
  .toggle.on { background:#2b5cff; }
  .toggle.on::after { left:23px; }

  label { color:#888; font-size:13px; }
</style>
</head>
<body>

  <div class="bubble">
    Привет
    <span class="status" id="status">
      <svg viewBox="0 0 20 14">
        <path class="p1" d="M1.6 7.5 6.1 12 13.6 2" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="p2" d="M10.5 12 18 2" fill="none" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </span>
  </div>

  <div>
    <button class="toggle" id="toggle"></button>
    <label>прочитано</label>
  </div>

  <script>
    const status = document.getElementById('status');
    const toggle = document.getElementById('toggle');
    toggle.addEventListener('click', () => {
      const read = status.classList.toggle('read');
      toggle.classList.toggle('on', read);
    });
  </script>

</body>
</html>
